<!doctype html>
<html><head><meta charset="utf-8">
<!-- <one sentence: what the reader should see>. The page is printed to one PDF page;
     set the size with @page and keep everything inside it. -->
<style>
  @page { size: 120mm 50mm; margin: 0; }
  html, body { margin: 0; width: 120mm; height: 50mm; font: 8pt "TeX Gyre Heros", Arial, sans-serif; color: #222; }
  .row { display: flex; gap: 6mm; padding: 6mm; align-items: center; }
  .box { border: 0.6pt solid #005685; background: #e0edf6; border-radius: 1.5mm; padding: 2mm 3mm; }
</style></head>
<body><div class="row"><div class="box">First step</div><div>&rarr;</div><div class="box">Second step</div></div></body></html>
