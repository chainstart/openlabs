# OpenLabs figure templates: `paper-writing figures new <paper_id> NAME --template <name>`.
# Each one compiles, is drawn at a journal width and carries real structure; replace the
# example content with the paper's own (numbers from the claim-evidence map).
# Shared styles: style/openlabs-fig.sty (TikZ), style/openlabs.mplstyle and
# style/openlabs_fig.py (matplotlib, SVG asset helpers).
schema_version: openlabs.paper_writing.figure_templates.v1
templates:
  - name: study-design
    file: study-design.tex
    figure_kind: schematic
    use_when: Empirical or clinical study whose readers must see data sources, exclusions and the sample size at every step down to the primary endpoint.
  - name: method-architecture
    file: method-architecture.tex
    figure_kind: schematic
    use_when: A model or system made of modules, where the reader needs the layers and the interface (shape, unit) passed between modules.
  - name: algorithm-loop
    file: algorithm-loop.tex
    figure_kind: schematic
    use_when: An iterative algorithm whose steps, stopping rule and update are clearer as a flow aligned with numbered pseudo-code.
  - name: binary-eclipse-geometry
    file: binary-eclipse-geometry.py
    figure_kind: schematic
    use_when: Detached binary only. Physical geometry that produces the observable, computed from the model (here orbit, sky projection and the resulting eclipse light curve).
  - name: settlement-timing
    file: settlement-timing.tex
    figure_kind: schematic
    use_when: A timing or settlement rule (market intervals, sampling windows) where one worked interval shows what each rule pays or measures.
  - name: degradation-rul
    field: reliability
    file: degradation-rul.py
    figure_kind: schematic
    use_when: Degradation, thresholds and prognostic quantities (failure threshold, prediction time, end-of-life distribution, RUL definition).
  - name: rolling-evaluation
    file: rolling-evaluation.svg
    figure_kind: schematic
    use_when: Evaluation protocol on a time axis (train/validation/holdout split, rolling-origin backtest, gaps that block leakage).
  - name: concept-contrast
    file: concept-contrast.tex
    figure_kind: schematic
    use_when: Two methods or designs that differ in one decisive respect, shown side by side on the same toy problem.
  - name: li-ion-cell
    file: li-ion-cell.svg
    figure_kind: schematic
    use_when: A physical object or device drawn in code with gradients (cell, device cross-section, sample) when no licensed asset or rendering from data exists.
  - name: contact-roche
    field: astronomy
    file: contact-roche.py
    figure_kind: schematic
    use_when: Contact envelope, inclination, eclipse projections and integrated light curve.
  - name: sector-profiles
    field: astronomy
    file: sector-profiles.py
    figure_kind: result
    use_when: Profile likelihood and matched extraction shifts by observing sector; supply the three verified input JSONs.
  - name: shared-export
    field: energy
    file: shared-export.py
    figure_kind: schematic
    use_when: Size shared export and compare storage with PV-only dispatch.
  - name: settlement-clock
    field: energy
    file: settlement-clock.py
    figure_kind: schematic
    use_when: Price the same dispatch on two settlement clocks.
  - name: policy-periods
    field: energy
    file: policy-periods.py
    figure_kind: schematic
    use_when: Explain a matched policy-period contrast with contemporaneous comparison sites.
  - name: specimen-split
    field: reliability
    file: specimen-split.py
    figure_kind: schematic
    use_when: Assign physical specimens before segmenting time series.
  - name: rank-agreement
    field: reliability
    file: rank-agreement.py
    figure_kind: result
    use_when: Show per-rig rank agreement and paired bootstrap uncertainty from inputs/ranks.csv.
  - name: sector-replication
    field: astronomy
    file: sector-replication.py
    figure_kind: result
    use_when: "Synthetic eclipse-depth recovery under a fixed eclipse shape. Replace illustrative inputs before manuscript use."
  - name: eclipse-contact
    field: astronomy
    file: eclipse-contact.py
    figure_kind: result
    use_when: "Circular edge-on transit of a dark disk over a uniformly bright disk. Replace illustrative inputs before manuscript use."
  - name: dispatch-replay
    field: energy
    file: dispatch-replay.py
    figure_kind: result
    use_when: "Illustrative fixed dispatch, lossless, one hour per step, no grid charging. Replace illustrative inputs before manuscript use."
  - name: revenue-spikes
    field: energy
    file: revenue-spikes.py
    figure_kind: result
    use_when: "Synthetic paired daily net cash; explicit full-year denominator. Replace illustrative inputs before manuscript use."
  - name: challenge-ranks
    field: reliability
    file: challenge-ranks.py
    figure_kind: result
    use_when: "Synthetic ranks; source ordering A–H; pair counts use strict inversions. Replace illustrative inputs before manuscript use."
  - name: specimen-failure
    field: reliability
    file: specimen-failure.py
    figure_kind: result
    use_when: "Synthetic vibration RMS, fixed baseline and forecasts for two complete units. Replace illustrative inputs before manuscript use."
  - name: plant-connections
    field: energy
    file: plant-connections.py
    figure_kind: schematic
    use_when: Matched PV and two-hour storage layouts in the five-minute NEM replay.
  - name: plant-dispatch
    field: energy
    file: plant-dispatch.py
    figure_kind: schematic
    use_when: Illustrative AC-bus balance over a single five-minute interval.
  - name: market-interval
    field: energy
    file: market-interval.py
    figure_kind: schematic
    use_when: Worked constant-price settlement interval with metered export.
  - name: rig-instrumentation
    field: reliability
    file: rig-instrumentation.py
    figure_kind: schematic
    use_when: Worked vibration acquisition layout, with a radial accelerometer.
  - name: bearing-protocol
    field: reliability
    file: bearing-protocol.py
    figure_kind: schematic
    use_when: Illustrative specimen-level split before signal segmentation.
  - name: viewing-geometry
    field: astronomy
    file: viewing-geometry.py
    figure_kind: schematic
    use_when: Illustrative edge-on transit and distant observer; lengths are schematic.
  - name: transit-formation
    field: astronomy
    file: transit-formation.py
    figure_kind: schematic
    use_when: Uniform disk, central transit; geometric flux loss at full overlap.
  # SVG/HTML route: HTML + CSS layout, library icons inlined as vectors (asset:FIELD/NAME.svg,
  # search with `paper-writing figures assets WORDS`), connectors whose width carries a value,
  # and matplotlib insets drawn from data (sidecar "insets"). See style/openlabs-fig.css.
  - name: schematic-flow
    file: schematic-flow.html
    figure_kind: schematic
    use_when: Generic system, pipeline or mechanism schematic built from cards, groups, icons and connectors (line width can carry a quantity).
  - name: pv-storage-grid
    field: energy
    file: pv-storage-grid.html
    figure_kind: schematic
    companions: [_pv-storage-day.py]
    sidecar: {insets: {day: _pv-storage-day.py}}
    use_when: PV plant with a battery at a shared grid connection; power flows sized by MW, price/control path, one-day inset.
  - name: contact-binary
    field: astronomy
    file: contact-binary.html
    figure_kind: schematic
    companions: [_contact-binary-insets.py]
    sidecar: {insets: {roche: _contact-binary-insets.py, phases: _contact-binary-insets.py, lc: _contact-binary-insets.py}}
    use_when: Contact binary geometry computed from the Roche model (envelope, critical surfaces), sky views at four phases and the resulting light curve.
  - name: bearing-testbed
    field: reliability
    file: bearing-testbed.html
    figure_kind: schematic
    companions: [_bearing-insets.py]
    sidecar: {insets: {signal: _bearing-insets.py, hi: _bearing-insets.py}}
    use_when: Run-to-failure rig (motor, test bearing, load, sensors, DAQ) and the data path to a health indicator and RUL.
  - name: isolate-tracing
    field: biology
    file: isolate-tracing.html
    figure_kind: schematic
    companions: [_isolate-insets.py]
    sidecar: {insets: {tree: _isolate-insets.py, attr: _isolate-insets.py}}
    use_when: Microbial isolates from reservoirs and cases through culture and sequencing to a cgMLST tree and source attribution (also a pattern for clinical sample pipelines).
