schema_version: openlabs.paper_writing.skill_profiles.v1
selection_policy:
  invocation: explicit
  maximum_active_components: 3
  roles: [primary_writing, domain, review_or_citation]
profiles:
  ai_ml:
    entry_skill: openlabs-ai-paper
    entry_path: skills/openlabs-ai-paper
    domains: [ai]
    components:
      primary_writing: ai-research-writing-skill
      domain: statistical-analysis
      review_or_citation: peer-review
  mathematics:
    entry_skill: openlabs-math-paper
    entry_path: skills/openlabs-math-paper
    domains: [math]
    components:
      primary_writing: scientific-writing
      domain: sympy
      review_or_citation: peer-review
  materials:
    entry_skill: openlabs-materials-paper
    entry_path: skills/openlabs-materials-paper
    domains: [materials]
    components:
      primary_writing: scientific-writing
      domain: statistical-analysis
      review_or_citation: peer-review
  physics:
    entry_skill: openlabs-physics-paper
    entry_path: skills/openlabs-physics-paper
    domains: [physics]
    components:
      primary_writing: scientific-writing
      domain: sympy
      review_or_citation: peer-review
  quantitative_finance:
    entry_skill: openlabs-quant-paper
    entry_path: skills/openlabs-quant-paper
    domains: [quant]
    components:
      primary_writing: scientific-writing
      domain: statistical-analysis
      review_or_citation: peer-review
quality_gate:
  require_target_journal_after_basic_draft: true
  target_journal_classification_system:
    math:
      - 2026 XinRui Mathematics
    ai:
      - 2026 XinRui Mathematics
      - 2026 XinRui Medicine
      - 2026 XinRui Computer Science
    cs:
      - 2026 XinRui Computer Science
      - 2026 XinRui Medicine
    se:
      - 2026 XinRui Computer Science
      - 2026 XinRui Medicine
    physics:
      - 2026 XinRui Physics and Astronomy
  allowed_target_journal_tiers: [1, 2]
  require_no_mandatory_author_fee: true
  require_canonical_target_journal_format: true
  zenodo_public_identifier: display_id
  manuscript_style_check: required
  manuscript_style_command: python -m paper_writing style-check --paper-id <paper_id>
  require_ai_use_declaration: true
  ai_workflow_disclosure_location: final_ai_use_declaration_only
  require_code_and_formalization_purpose_disclosure: true
  forbid_internal_audit_terms_and_paths: true
  scan_bibliography_workflow_notes: true
  review_mode: independent_dual_provider_panel
  review_panel_size: 2
  parallel_execution: false
  independent_contexts: required
  prior_reviews_hidden: required
  execution_order: frozen_codex_then_blind_claude
  reviewers:
    reviewer-1: {runtime: codex, provider: openai-codex, session: fresh}
    reviewer-2: {runtime: claude-code, provider: packy, model: claude-opus-5, session: fresh}
  score_aggregation: coordinatewise_minimum
  decision_aggregation: strictest_decision
  review_skill: openlabs-paper-review
  review_skill_path: skills/openlabs-paper-review
  score_field: scores.overall
  score_type: integer
  score_range: [1, 10]
  require_dual_simulated_decisions: true
  score_standard:
    ai: top_conference
    cs: top_conference
    se: top_conference
    math: four_top_math_journals
    materials: leading_materials_journals
    physics: leading_physics_journals
    quant: leading_quant_finance_journals
  recommendation_views:
    ai: [top_conference, cas_zone_1_journal]
    cs: [top_conference, cas_zone_1_journal]
    se: [top_conference, cas_zone_1_journal]
    math: [four_top_math_journals, cas_zone_1_journal]
    materials: [leading_materials_journals, cas_zone_1_journal]
    physics: [leading_physics_journals, cas_zone_1_journal]
    quant: [leading_quant_finance_journals, cas_zone_1_journal]
  gate_decision_standard: cas_zone_1_journal
  cas_zone_1_scope: major_category
  reviewer_roles:
    ai: cs_top_tier
    cs: cs_top_tier
    se: cs_top_tier
    math: math
    materials: materials
    physics: physics
    quant: quant_finance
  reviewer_rubric_ids:
    ai: ara.revision-agent.cs-top-tier.v1
    cs: ara.revision-agent.cs-top-tier.v1
    se: ara.revision-agent.cs-top-tier.v1
    math: ara.paper-writing.math-four-journals.v1
    materials: openlabs.paper-writing.materials-leading-journals.v1
    physics: openlabs.paper-writing.physics-leading-journals.v1
    quant: openlabs.paper-writing.quant-finance-leading-journals.v1
  settings_path: registry/settings.yaml
  settings_key: quality_gate
  required_before_submission_consideration: true
