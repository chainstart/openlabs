[project]
name = "openlabs-quant"
version = "0.1.0"
description = "Reproducible quantitative-finance research environment for OpenLabs."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "arch>=7.2,<9",
  "duckdb>=1.3,<2",
  "exchange-calendars>=4.8,<5",
  "httpx>=0.28,<0.29",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "polars>=1.30,<2",
  "pyarrow>=18,<23",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "scikit-learn>=1.7,<2",
  "scipy>=1.13,<2",
  "statsmodels>=0.14,<0.15",
]

[dependency-groups]
research = [
  "cvxpy>=1.6,<2",
  "lightgbm>=4.6,<5",
  "matplotlib>=3.9,<4",
  "mlflow>=3,<4",
  "optuna>=4,<5",
  "pyqlib>=0.9.7,<0.10",
  "vectorbt>=0.28,<0.29",
  "xgboost>=3,<4",
]
execution = [
  "ccxt>=4.4,<5",
  "nautilus-trader>=1.220,<2",
]
dev = [
  "pytest>=9,<10",
  "ruff>=0.16,<0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
