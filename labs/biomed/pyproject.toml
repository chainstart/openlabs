[project]
name = "openlabs-biomed"
version = "0.1.0"
description = "Public-data computational biomedicine and cheminformatics for OpenLabs"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.13,<2", "pandas>=2.2,<3",
  "pyarrow>=18,<24", "duckdb>=1.1,<2", "httpx>=0.28,<0.29",
  "scikit-learn>=1.5,<2", "statsmodels>=0.14,<0.15",
  "matplotlib>=3.9,<4", "pyyaml>=6,<7", "snakemake>=9,<10",
]

[dependency-groups]
chem = ["rdkit>=2024.9,<2027", "xgboost-cpu>=3,<4", "optuna>=4,<5"]
bulk = ["pydeseq2>=0.5,<0.6", "gseapy>=1.1,<2"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "jsonschema>=4,<5", "uv==0.13.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
