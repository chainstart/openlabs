[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "matfactory"
version = "0.2.0"
description = "Auditable literature extraction and MLIP molecular-dynamics workflows for solid electrolytes"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
]

[project.optional-dependencies]
extract = []
simulation = [
  "ase>=3.26",
  "chgnet>=0.4.2",
  "pymatgen>=2025.0",
  "scipy>=1.14",
]
analysis = [
  "matplotlib>=3.9",
  "scipy>=1.14",
]
discovery = [
  "ase>=3.26",
  "chgnet>=0.4.2,<0.5",
  "mace-torch>=0.3.16,<0.4",
  "phonopy>=4.4,<5",
  "pymatgen>=2025.0",
  "scipy>=1.14",
  "seekpath>=2.1,<3",
  "spglib>=2.6,<3",
]
test = [
  "pytest>=8",
]

[project.scripts]
matfactory-harvest = "matfactory.harvest:main"
matfactory-reextract = "matfactory.reextract:main"
matfactory-md = "matfactory.mlipmd:main"
matfactory-compare = "matfactory.compare:main"
matfactory-validate = "matfactory.validation:main"
matfactory-campaign = "matfactory.campaign:main"
matfactory-discover = "matfactory.structure_discovery:main"
matfactory-literature = "matfactory.literature_review:main"
matfactory-cod-candidates = "matfactory.cod_candidates:main"
matfactory-orderings = "matfactory.orderings:main"
matfactory-models = "matfactory.model_registry:main"
matfactory-relax = "matfactory.discovery_relax:main"
matfactory-soft-modes = "matfactory.soft_modes:main"
matfactory-discovery-dft = "matfactory.discovery_dft:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
