[project]
name = "openlabs-physics"
version = "0.1.0"
description = "Reproducible analytical, computational and public-data physics environment for OpenLabs."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "h5py>=3.12,<4",
  "httpx>=0.28,<0.29",
  "matplotlib>=3.9,<4",
  "mpmath>=1.3,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pint>=0.24,<1",
  "pydantic>=2.10,<3",
  "python-flint>=0.7,<1",
  "pyyaml>=6,<7",
  "scipy>=1.13,<2",
  "sympy>=1.13,<2",
  "uncertainties>=3.2,<4",
  "xarray>=2025.1,<2027",
]

[dependency-groups]
optimization = [
  "clarabel>=0.10,<1",
  "cvxpy>=1.6,<2",
  "scs>=3.2,<4",
]
quantum = ["qutip>=5.2,<6"]
astro = [
  "astropy>=7.1,<9",
  "gwosc>=0.8,<1",
]
hep = [
  "awkward>=2.8,<3",
  "hist>=2.8,<3",
  "iminuit>=2.31,<3",
  "particle>=0.25,<1",
  "pyhf>=0.7,<0.8",
  "uproot>=5.6,<6",
  "vector>=1.6,<2",
]
dev = [
  "pytest>=9,<10",
  "ruff>=0.16,<0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
