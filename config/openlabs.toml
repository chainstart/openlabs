[factory]
max_worker_processes = 8
lease_seconds = 600
heartbeat_seconds = 30
max_attempts = 3
retry_backoff_seconds = 120
auto_continue = true
# Active production-plan campaigns renew this safety window automatically.
# Bounded campaigns still treat it as a lifetime ceiling.
max_auto_tasks_per_epoch = 24
# Long-lived same-role Codex sessions are preferred. This remains a crash guard,
# not a scientific phase or checkpoint cadence.
max_task_wall_seconds = 43200
max_campaign_agent_seconds = 86400
launch_jobs = true

[resources]
# The shared systemd slice and scheduler both cap aggregate CPU at 75% of the
# logical CPUs visible to OpenLabs.
max_cpu_fraction_of_host = 0.75
reserve_cpu_threads = 2
# This workstation currently exposes about 8 GiB to WSL. Keep 2 GiB for the host;
# an 8 GiB reservation would reject every task before a worker can start.
# This is scheduler headroom, not a change to the aggregate cgroup ceilings.
reserve_memory_mib = 2048
# Keep 16 GiB free on the current workspace volume; the previous 64 GiB
# reservation exceeded available disk and rejected every bounded task.
reserve_scratch_mib = 16384
default_task_cpu_threads = 2
default_task_memory_mib = 4096
default_task_scratch_mib = 4096

[retention]
archive_result_receipts = true

[program]
# Research-program controller (topic ledger, active-topic slots, freezes).
# Off by default; when false the tick neither reads nor writes the ledger.
enabled = false
# Topics counted against this limit: admitted (reserved), active and in_review.
max_active_topics = 5
# Papers waiting in ready_queue beyond this pause new admissions (they do not
# occupy research slots).
max_ready_unsubmitted = 6
# Relative to the data repository root.
ledger_path = "registry/topic-ledger.json"

[budget]
# Provider token-quota / rate-limit handling. Quota failures never consume
# max_attempts; they back off the affected runner tier and halve agent
# parallelism, which then recovers by restore_step per healthy completion.
# Upper bound on concurrently launched agents (also bounded by max_worker_processes).
max_parallel_agents = 3
# Exponential backoff per consecutive quota hit on one runner; a parsed provider
# reset time wins when it is later. Both are capped by quota_backoff_cap_minutes.
quota_backoff_minutes = [15, 30, 60, 120, 300]
quota_backoff_cap_minutes = 300
restore_step = 1
# Consecutive quota deferrals of one task before ordinary failure handling.
quota_retry_limit = 8
# Automatic retries of needs_human/quarantined tasks that failed for an
# infrastructure reason (transport, quota, launch, missing result bundle).
infrastructure_retry_limit = 3
