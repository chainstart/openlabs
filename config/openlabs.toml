[factory]
max_worker_processes = 8
lease_seconds = 600
heartbeat_seconds = 30
max_attempts = 3
retry_backoff_seconds = 120
auto_continue = true
# Active production-plan campaigns renew this safety window automatically.
# Bounded campaigns still treat it as a lifetime ceiling.
max_auto_tasks_per_epoch = 24
# Long-lived same-role Codex sessions are preferred. This remains a crash guard,
# not a scientific phase or checkpoint cadence.
max_task_wall_seconds = 43200
max_campaign_agent_seconds = 86400
# false = production stop: no agent task is claimed or launched (queued work waits,
# the loop keeps ingesting results and releasing remote waits) and no quota probe
# runs. Local compute dispatch follows launch_jobs unless launch_local_compute is set.
launch_jobs = true
# launch_local_compute = true
# No-progress guard (spin_guard.py): consecutive tasks of one campaign without a new
# artifact/card/job back off from the 4th (60, 240, 1440 min) and stop for a human
# at the 8th. Owner seats and topic scouts have their own breakers.
no_progress_backoff_after = 4
no_progress_escalate_after = 8
no_progress_backoff_minutes = [60, 240, 1440]
# Same-state stalls (spin_guard.state_signature, 2026-11-20): an owner seat's state -
# phase, packet status, research-file digest, job ids, review stage, writer, ledger
# status - unchanged and without progress this many seats in a row (direction decisions
# do not reset the count) schedules one direction decision with a diagnosis; still the
# same stall_seats_after_decision seats after it, the topic gets no further seat and is
# listed under program.stuck_topics until its workspace or ledger status changes.
# 0 disables it. The tick report also lists program.topics_without_next_step.
stall_signature_repeats = 6
stall_seats_after_decision = 3
# User rule 2026-11-18: large downloads through the proxy route (a file >= 200 MB or a
# batch >= 1 GB) only in the off-peak window; `--route auto` is not limited. Claude
# production sessions get a PreToolUse hook enforcing it; Codex sessions only with
# proxy_download_codex_hook = true (enable after one bounded live check).
# docs/operations.zh.md ("经代理的大体量下载只在闲时").
proxy_download_window = ["02:00", "14:00"]
proxy_download_timezone = "Asia/Shanghai"
proxy_download_large_file_mib = 200
proxy_download_large_batch_mib = 1024
proxy_download_codex_hook = false

[resources]
# The shared systemd slice and scheduler both cap aggregate CPU at 75% of the
# logical CPUs visible to OpenLabs.
max_cpu_fraction_of_host = 0.75
reserve_cpu_threads = 2
# This workstation currently exposes about 8 GiB to WSL. Keep 2 GiB for the host;
# an 8 GiB reservation would reject every task before a worker can start.
# This is scheduler headroom, not a change to the aggregate cgroup ceilings.
reserve_memory_mib = 2048
# Keep 16 GiB free on the current workspace volume; the previous 64 GiB
# reservation exceeded available disk and rejected every bounded task.
reserve_scratch_mib = 16384
default_task_cpu_threads = 2
default_task_memory_mib = 4096
default_task_scratch_mib = 4096

[retention]
archive_result_receipts = true

[program]
# Research-program controller: topic ledger, active-topic slots, freezes, the
# release pipeline and delivery. THIS FILE IS THE ONLY SOURCE of these switches
# and limits; the code reads nothing else. The data repository's
# registry/settings.yaml#research_portfolio.autonomy only records what the owner
# decided and when (with quotes) and the scientific policy that agents read.
# Every switch below is off by default; with enabled = false the tick neither
# reads nor writes the ledger and behaves exactly as before.
enabled = false
# Topics counted against this limit: admitted (reserved), active and in_review.
max_active_topics = 5
# Papers waiting in ready_queue beyond this pause new admissions (they do not
# occupy research slots).
max_ready_unsubmitted = 6
# Relative to the data repository root.
ledger_path = "registry/topic-ledger.json"
# true: a new researcher/experimenter workstream of an ordinary (non-program)
# project is not activated unless the ledger links it to an admitted topic.
enforce_admission = false
# Reusable scripts/SOP index offered to scouts and reviewers when the file exists
# (relative to the data repository root).
asset_index_path = "registry/reusable-assets.json"
# Legacy host-domain filter and preference order when no [program.lines] table is set.
domains = []
# Research lines: one [program.lines.<line id>] table per line, in scout-rotation order.
#   mode  = "full" (supply and research starts) | "supply_only" (scout and review; an
#           admitted topic waits for its campaign) | "polish" (neither) | "off" (neither,
#           and out of the scout rotation). Unlisted lines get "polish" under polish_mode,
#           else "full".
#   slots = the line's research slots (admitted + active + in-review topics). Unset: no limit.
# [program.lines.astro-survey-photometry]
# mode = "full"
# slots = 2
# Direction file read by scouts and reviewers; lines whose environment.status != "ready"
# are not scouted or reviewed.
research_lines_path = "registry/research-lines.yaml"
# Calendar limit from admission to a review-ready manuscript. Past it the topic
# gets one direction decision (lead tier, other model family); it is not frozen
# outright.
max_days_from_admission_to_ready = 28
# Hard Agent-time ceiling per topic (72 h). A topic campaign's budget is the
# smaller of this and its proposal's compute_estimate.agent_hours.
topic_max_agent_seconds = 259200
# Evidence-based journal grading before writing (user decision 2026-11-25, item 3).
grade_before_writing = true
nc_journals = ["Nature Communications"]
# false: ready papers are only queued (ready_queue). true: each ready paper goes
# through the release pipeline (docs/operations.zh.md, "发布流水线"): formal
# fixes, Zenodo support material, delta review, local data-repository commits,
# then delivery to the paper-management site WITHOUT a submission handler
# (python -m openlabs program assign-handler after the owner's review). Needs
# ARA_PAPER_MANAGE_API_URL/_KEY, the paper-writing CLI (paper_writing_command)
# and a commit identity ([program.git]).
auto_handoff = false
# argv prefix of the paper-writing CLI the pipeline calls (it owns YAML, HTTP
# and LaTeX). The delta review builds LaTeX; to keep it inside the aggregate
# resource guard give the guard's absolute path (the command runs in the data
# repository): ["<openlabs>/bin/openlabs-resource-guard", "--", "paper-writing"].
# paper_writing_command = ["paper-writing"]
# Delivery attempts per ready paper, one per tick; then it waits for a human.
handoff_max_attempts = 3
# Credentials of the release pipeline without exporting them into the tick (research
# seats inherit the tick's environment): an absolute path to a NAME=VALUE file, owned
# by this user, mode 0600 or stricter, kept outside every Git repository. Only
# ARA_PAPER_MANAGE_API_URL, ARA_PAPER_MANAGE_API_KEY and ZENODO_ACCESS_TOKEN are read,
# and only into the delivery / Zenodo child process; the environment still wins.
# credentials_file = "/path/outside/git/pipeline-credentials.env"
# `program reconcile` (dry run by default; --apply writes through the transition
# functions) and the tick's next-step check: a topic or task record untouched this many
# days is stale (parked legacy topic -> archived as frozen/legacy_archived, orphaned
# needs_human -> closed, admitted card never materialized -> reported).
reconcile_stale_days = 5
# A topic a person paused (research_state status "paused": `program pause-topic`,
# an operator_hold, or no record) is only reported by reconcile, never archived;
# above 0, archived once the pause is this many days old (2026-11-24; 0 = never).
reconcile_operator_pause_days = 0
# false: the pipeline stops before the first Zenodo write (zenodo prepare /
# zenodo release) and marks the paper as waiting for a human. true: it runs them
# on production, but only while settings.yaml#support_publication.
# standing_production_release_authorization is true and ZENODO_ACCESS_TOKEN is
# set; OPENLABS_ENABLE_EXTERNAL_WRITES=1 is set for that one child process only.
auto_release = false
# "zenodo" (default): the Zenodo steps above. "none": never create a Zenodo or
# other public record; a paper whose support record is only planned gets
# support.publication.mode not_required with support_none_reason (it waits for
# the owner when a record exists or its data-availability section names one).
# support_release = "zenodo"
# support_none_reason = "No Zenodo record or other public deposit is made ..."
# Failures per pipeline stage, and formal-fix writer rounds, before the paper
# stops for a human (listed under release_exhausted in the tick report).
release_max_attempts = 3
# Upper bound in seconds for one `review unified-run --delta-only` (LaTeX build
# plus the mandatory formal verification).
release_review_timeout_seconds = 7200

# Local commits the release pipeline makes in the data repository: only the
# paper's registry record, papers/<id>/, its review records and the topic
# ledger; never `git add -A`, never pushed. Without user_name/user_email the
# repository's own git config is used; with neither the commit step waits and
# the tick report says so.
[program.git]
# user_name = "OpenLabs release pipeline"
# user_email = "openlabs@example.invalid"
# Subject line; fields {action} {paper_id} {version} {topic_id}. The body always
# names paper, version, action and topic.
message = "{action}: {paper_id} v{version}"

# Owner mode (owner decision 2026-11-14): after admission one owner agent session
# carries a topic to a reviewed manuscript or a freeze, deciding every next step
# itself (sub-agents and the other provider's models included). It replaces the
# staged maturation/replan/continue/readiness/write/remediation/revision tasks.
# Kept: the admission gate, the hash-bound pre-registered endpoint, the
# cross-family paper_review (comments return to the owner session), the
# direction decision as circuit breaker, and the human confirmation of a
# submission. "off" | "all" | ["<research-line id>", ...]. Topics already running
# switch at their next successor; running and parked tasks are never interrupted.
# owner_mode = ["astro-survey-photometry"]
# Card intake (2026-11-16): run a line's declared admission_precheck (no model) and raise
# a card to the line's card_compute_floor before the admission review
# (research-lines.yaml; docs/operations.zh.md "立项前的机械预检与核时下限").
# card_precheck = true
# card_precheck_max_seconds = 900
# card_compute_floor = true

# Compute pacing (2026-11-18; docs/operations.zh.md "算力节奏"). While the CPU threads
# declared by QUEUED jobs of the ailab and local compute queues exceed
# compute_backlog_ratio x (ailab cpu_threads + local max_cpus), or more than
# compute_backlog_max_queued_jobs jobs are queued (0 = no job-count limit), no new scout,
# admission review or topic campaign starts; topics in research run on, and the gate lifts
# by itself once the backlog falls (tick report: production_blocked reason compute_backlog).
# With ailab 8 + local 12 threads the default holds new topics above 40 queued threads.
# compute_backlog_gate = true
# compute_backlog_ratio = 2.0
# compute_backlog_max_queued_jobs = 0
# CPU threads one topic's queued + running jobs may declare at once (owner brief; and
# openlabs-remote refuses a submission beyond it). 8 = about one ailab; 0 = no limit.
# campaign_compute_threads = 8
# Per-line research slots: [program.lines.<line id>] slots (see research lines above).

# Topic supply hard guards (2026-11-28, supply simplification: 8 keys).
[program.supply]
max_concurrent_scouts = 2
scout_min_interval_hours = 1.0
candidate_pool_size = 4
scout_runners = []
scout_weekly_usd_per_line = 100.0
max_topic_data_gb = 2000.0
dedup_similarity = 0.8
max_concurrent_reviews = 4

# Per-topic direction-decision choices that keep a topic alive; afterwards only
# freeze is accepted (an exhausted choice is refused and the topic frozen).
[program.direction_limits]
targeted_core_analysis = 1
retarget_or_short_format = 2

# Owner seats ([program].owner_mode). An owner seat is ordinary work for the quota
# rules (paced 80% ceiling) but not subject to Fable's lead_review_ceiling; Fable's
# lead_decision_reserve stays above the ordinary ceiling.
[program.owner]
# Main-agent preference: Fable, then Opus 5.5, then gpt-astra ([runners.*] names).
runners = ["lead_claude", "worker_claude", "lead_gpt"]
# One seat (one agent process) at most this long; OPENLABS_AGENT_TIMEOUT_SECONDS
# still caps it.
seat_wall_seconds = 14400
# A queued seat whose runner cannot start it this long moves to the next usable
# runner (same model: the session is kept; another model, even of the same provider,
# starts a fresh session from the owner's handover - prompt caches are per model).
switch_after_minutes = 120
keep_session_within_provider = true
# Topics one runner may own at once (unlisted: no limit).
max_topics_per_runner = { lead_claude = 1 }
# Consecutive seats without new evidence that schedule a direction decision. Log,
# handover, research_state.json and quota/checkpoint receipts are not evidence.
no_progress_seats = 3
# From the 2nd no-progress seat on the next seat waits (minutes; the last repeats).
no_progress_backoff_minutes = [10, 30, 120]
# Shorter seats count as progress only through jobs, artifacts, phase or status.
short_seat_seconds = 180
# Default model of Claude sub-agents started without an explicit model.
claude_subagent_model = "claude-opus-5-5"
# GPT models the brief offers (codex exec / Codex spawn_agent); the brief names
# whatever these say, so a model upgrade is a change here only.
codex_helper_model = "gpt-6.2-sol"
codex_light_model = "gpt-6-luna"
# Recompute review (2026-11-16): ready_for_review first goes to an independent
# reviewer of another family who recomputes the core results from the data; major
# returns to the owner (next round, fresh reviewer), minor/accept lead to the unified
# review, reject or major in the last round to a direction decision. false: straight
# to the unified review. docs/operations.zh.md ("负责人模式").
recompute_review = true
review_max_rounds = 3
# Seats one agent session runs before the next seat starts fresh from the owner's
# OWNER_HANDOVER.md (1 = always fresh, 0 = no limit); optional token threshold.
session_max_seats = 1
session_max_tokens_read = 0
# Short continuation (2026-11-20): a seat queued right after the last one resumes its
# session even past session_max_seats when the last seat's final context is below
# short_resume_context_tokens, it finished at most short_resume_gap_minutes ago, the model
# is the same and the session read less than short_resume_max_tokens_read in total; not
# started within the gap -> fresh. 0 = off (default: on sol the carried context cost more
# than the fresh start saved). Suggested when enabled: 100000 / 10 / 1000000.
short_resume_context_tokens = 0
short_resume_gap_minutes = 10
short_resume_max_tokens_read = 1000000
handover_max_bytes = 8192
# Manuscript writer (user decision 2026-11-19). Unset: the owner writes. Set: when the
# owner's packet declares the research done (phase "writing", or a first ready_for_review
# before any review), this runner writes the whole paper from OWNER_HANDOVER.md and every
# revision after it; reviews avoid its family. Its seats do not count against
# max_topics_per_runner; at most max_writing_topics of them run at once. A writing seat
# waits for the writer (quota, pacing, slot) up to writing_wait_hours, then the original
# owner writes (noted on the topic). docs/operations.zh.md ("写稿者交接").
# writing_runner = "worker_claude"
# max_writing_topics = 2
# writing_wait_hours = 12

# Token cost in the tick report (token_cost, topic_economics) and `program
# utilization`. Prices in USD per million tokens (list-price equivalent, not a bill);
# defaults are the 2026-11-16 cost review's. economics_since: only attempts finished
# after it count toward the per-paper averages.
[reporting]
token_window_hours = 24
# economics_since = "2026-11-17T00:00:00Z"
# [reporting.prices.gpt-6.2-astra]
# input = 8.0
# cached_input = 0.4
# cache_write = 10.0
# output = 40.0

# Reusable-asset library (index at [program].asset_index_path). Both switches
# off: packets, task specs and the tick are unchanged. Only acts while
# [program].enabled is true. docs/operations.zh.md ("可复用资产库").
[program.assets]
# Ranked one-line asset summaries in scout/admission/direction/research inputs,
# the admission check of a card's reusable_assets, assets_used/assets_broken
# counting and the periodic archive.
enabled = false
# One light-tier topic_retrospective task per topic entering ready_queue or
# frozen (topics that got there before the switch was turned on are skipped).
retrospective_enabled = false
# Asset bodies, relative to the data repository (archive in <root>/archive).
root = "assets"
summary_limit = 40
summary_max_chars = 12000
maintenance_interval_hours = 24
# Tools never used this many days after registration are archived.
unused_archive_days = 120
max_lessons = 200
# Consecutive assets_broken reports that archive an asset.
broken_reports_to_archive = 2
# Code-repository globs scanned by `python -m openlabs program assets seed`.
seed_paths = ["labs/*/tools", "packages/research-core"]

[budget]
# Provider token-quota / rate-limit handling. Quota failures never consume
# max_attempts; they back off the affected runner tier and halve agent
# parallelism, which then recovers by restore_step per healthy completion.
# Upper bound on concurrently launched agents (also bounded by max_worker_processes).
max_parallel_agents = 3
# Exponential backoff per consecutive quota hit on one runner; a parsed provider
# reset time wins when it is later. Both are capped by quota_backoff_cap_minutes.
quota_backoff_minutes = [15, 30, 60, 120, 300]
quota_backoff_cap_minutes = 300
restore_step = 1
# Consecutive quota deferrals of one task before ordinary failure handling.
quota_retry_limit = 8
# Automatic retries of needs_human/quarantined tasks that failed for an
# infrastructure reason (transport, quota, launch, missing result bundle).
infrastructure_retry_limit = 3
# Adaptive launch ceiling. false: max_parallel_agents applies as is. true: each
# tick moves the ceiling by at most adaptive_step toward what runnable tasks,
# measured container load and quota pace allow (up while some provider would
# end its window below its ceiling at the current pace and the container is
# below host_utilization_target; down by one when it is above it or every
# provider is over-paced). max_parallel_agents and the quota halving stay hard
# limits. The tick report's parallel_limit says which limit binds.
adaptive_parallel = false
adaptive_step = 2
# Measured container CPU (cgroup, since the previous tick) and memory (page
# cache excluded). Agents mostly wait on model responses, so low CPU alone never
# raises the agent count past what quota pace and the hard ceiling allow.
host_utilization_target = 0.8
# Declared ailab load that agents are encouraged to fill; reported against its
# target in the tick report and `program utilization` (the bridge admits jobs).
ailab_utilization_target = 0.9

[routing]
# Quota-aware runner selection. INERT until a [runners] table exists: without
# one, every runner is its own quota key and scheduling is exactly as before.
# Owner rule 2026-11-14, on every window of every provider: ordinary tasks
# stop at ordinary_ceiling used, every automatic task (reviews, decisions) at
# hard_ceiling. Both are reached only on the window's last day: at elapsed
# share x a class may use min(ceiling, max(ceiling x pace(x), pace_lead)).
# pace_curve is piecewise linear [[share, factor], ...] (shares from 0,
# increasing; factors non-decreasing, ending at 1). The default front-loads:
# 7-day ends of days 1..6 -> 0.3125 0.525 0.6875 0.8125 0.9125 1.0. Plain
# linear: [[0, 0], [0.8571, 1]]; [[0, 1]] turns pacing off. Windows shorter
# than pace_min_window_hours (the 5-hour one) are capped, not paced.
# One provider may get its own pair (unset keys keep these global values; its
# ordinary ceiling may not exceed its hard one; the provider must be one used
# in [runners]), e.g. as a separate table after [routing]:
#   [routing.provider_ceilings.anthropic]
#   ordinary_ceiling = 0.7
ordinary_ceiling = 0.8
hard_ceiling = 0.9
pace_curve = [[0, 0], [0.1429, 0.3125], [0.2857, 0.525], [0.4286, 0.6875], [0.5714, 0.8125], [0.7143, 0.9125], [0.8571, 1.0]]
pace_lead = 0.05
pace_min_window_hours = 48
# Ceiling a manual `program quota-override` or `enqueue --quota-override` may
# use at most (never 100%: paid overage).
override_max_ceiling = 0.99
# Readings older than this are "unknown": dispatch allowed, one task in flight
# (unless stale_estimate_hours extrapolates them).
snapshot_stale_hours = 6
unknown_headroom = 0.5
# Protected lead (Fable): of every window it depends on, keep this much for
# decision tasks only (topic admission, direction decisions, portfolio
# planning); reviews may not use it.
lead_decision_reserve = 0.25
# Fable takes reviews (and other non-decision work) only up to this used
# fraction; past it Claude-family reviews go to the Claude worker runner.
lead_review_ceiling = 0.60
# User decision 2026-11-16: a review or decision that must leave the producer's
# model family (admission, direction decision, recompute review, paper review),
# whose other family is configured but has no runner able to take it for quota
# reasons (unavailable: ceiling, pace, reserve, backoff), goes to a different
# model of the producer's family instead of waiting; the task_routed event says
# independence = "same_family_different_model" and independence_fallback =
# "other_family_quota_unavailable" with the other family's resume_at. A busy but
# available other family is still waited for; with no different model in the
# family the task keeps waiting. Once the other family is back, new tasks cross
# families again (tasks already dispatched are not recalled). false: always wait.
independence_fallback_on_quota = true
# Wait instead when the other family is expected back within this many minutes
# (0: fall back as soon as it is unavailable; an unknown reopening time does not
# hold the fallback back).
independence_fallback_min_wait_minutes = 0
# Consecutive non-infrastructure failures of a worker-tier task before its next
# attempt is routed to the lead tier with a diagnosis preamble (0 disables).
escalate_to_lead_after_failures = 2
# Provider assumed for the legacy cheap/balanced/frontier backoff keys.
legacy_runner_provider = "openai-codex"
protected_models = ["claude-fable-5-2"]
# Read once every probe_idle_minutes at most, and only while readings are stale.
probe_idle_minutes = 360
codex_sessions_dir = "~/.codex/sessions"
# Use-it-before-it-resets strategy: > 0 turns it on (the value is no longer a
# ceiling; 0 compares plain headroom, as before). Work is spread over
# providers in proportion to relative abundance, (final ceiling - used) /
# share of the window still to run, so a provider whose window resets soon
# with quota left gets more work and a freshly reset one is saved. A runner's
# abundance is that of its tightest window (Claude: 5-hour, weekly and Fable's
# own), so the 5-hour window throttles it before the quota backoff has to.
utilization_target = 0
# Minutes between free refreshes of a stale Codex reading (newest session
# file); unset: probe_idle_minutes, like the paid Claude probe.
# stale_refresh_minutes = 10
# A stale reading younger than this many hours is extrapolated (used + the
# window's average pace since + this instance's agent-hours on the provider x
# estimate_fraction_per_agent_hour of a 7-day window) instead of limiting the
# provider to one task. 0 = off.
stale_estimate_hours = 0
estimate_fraction_per_agent_hour = 0.01

[routing.model_windows]
# Extra windows a model's calls report (measured 2026-11-11; name not documented).
"claude-fable-5-2" = ["seven_day_overage_included"]

[routing.probe_commands]
# Cheapest model only; a protected (Fable) model here is rejected at load time.
anthropic = ["claude", "-p", "ok", "--model", "claude-haiku-5-5", "--output-format", "stream-json", "--verbose", "--max-turns", "1"]

# [routing.claim_ranks] overrides the built-in map in
# orchestrator/src/openlabs/config.py (DEFAULT_CLAIM_RANKS).
#
# Division of labour ([routing.task_tiers]; docs/operations.zh.md "模型分工"): task
# type -> tier (lead / worker / light). A key may name a routing reason,
# "task_type:routing_reason", which wins over the plain task type; unlisted types
# keep the code default (DEFAULT_TASK_TIERS in config.py, the full table) or, failing
# that, the tier their runner name requests. Unknown tiers, malformed keys and
# unknown task types / routing reasons in "type:reason" keys are rejected at load.
# Reviews and decisions keep excluding the author's model family inside the tier.
# `program utilization` shows the resulting table (division_of_labour).
# Code defaults since the user decision of 2026-11-18 (lead = Fable / astra only for
# the key decisions; worker = Opus / sol):
# [routing.task_tiers]
# direction_decision = "lead"
# "portfolio_review:topic_admission" = "worker"
# portfolio_review = "worker"
# "paper_review:owner_recompute_review" = "worker"
# "paper_review:owner_review" = "worker"
# "paper_review:release_full_review" = "worker"
# replan = "worker"
# candidate_maturation = "worker"
# "paper_revision:direction_retarget" = "worker"
# "paper_readiness:direction_retarget" = "worker"

# Enable routing by declaring runners; argv comes from
# OPENLABS_AGENT_COMMAND_<NAME>_JSON / OPENLABS_AGENT_RESUME_COMMAND_<NAME>_JSON
# (see openlabs.env.example). Uncomment all six together: the GPT runners use
# Codex, the Claude runners use Claude Code with the same lab runtime, result-gate
# hooks and receipt check (docs/operations.zh.md, "Claude Code 研究执行者").
# Optional per runner: allow_subagents = true|false. Claude's sub-agent tools
# (Task, Agent) are granted to lead-tier runners only by default (cost control);
# this key overrides the tier.
# [runners.lead_gpt]
# provider = "openai-codex"
# tier = "lead"
# model = "gpt-6.2-astra"
# [runners.lead_claude]
# provider = "anthropic"
# tier = "lead"
# model = "claude-fable-5-2"     # protected; extra window from [routing.model_windows]
# [runners.worker_gpt]
# provider = "openai-codex"
# tier = "worker"
# model = "gpt-6.2-sol"
# [runners.worker_claude]
# provider = "anthropic"
# tier = "worker"
# model = "claude-opus-5-5"
# [runners.light_gpt]
# provider = "openai-codex"
# tier = "light"
