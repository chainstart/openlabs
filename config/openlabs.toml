[factory]
max_worker_processes = 8
lease_seconds = 600
heartbeat_seconds = 30
max_attempts = 3
retry_backoff_seconds = 120
auto_continue = true
# Active production-plan campaigns renew this safety window automatically.
# Bounded campaigns still treat it as a lifetime ceiling.
max_auto_tasks_per_epoch = 24
# Long-lived same-role Codex sessions are preferred. This remains a crash guard,
# not a scientific phase or checkpoint cadence.
max_task_wall_seconds = 43200
max_campaign_agent_seconds = 86400
launch_jobs = true

[resources]
# The shared systemd slice and scheduler both cap aggregate CPU at 75% of the
# logical CPUs visible to OpenLabs.
max_cpu_fraction_of_host = 0.75
reserve_cpu_threads = 2
# This workstation currently exposes about 8 GiB to WSL. Keep 2 GiB for the host;
# an 8 GiB reservation would reject every task before a worker can start.
# This is scheduler headroom, not a change to the aggregate cgroup ceilings.
reserve_memory_mib = 2048
# Keep 16 GiB free on the current workspace volume; the previous 64 GiB
# reservation exceeded available disk and rejected every bounded task.
reserve_scratch_mib = 16384
default_task_cpu_threads = 2
default_task_memory_mib = 4096
default_task_scratch_mib = 4096

[retention]
archive_result_receipts = true

[program]
# Research-program controller (topic ledger, active-topic slots, freezes).
# Off by default; when false the tick neither reads nor writes the ledger.
enabled = false
# Topics counted against this limit: admitted (reserved), active and in_review.
max_active_topics = 5
# Papers waiting in ready_queue beyond this pause new admissions (they do not
# occupy research slots).
max_ready_unsubmitted = 6
# Relative to the data repository root.
ledger_path = "registry/topic-ledger.json"
# A topic scout is scheduled only while fewer proposed (not yet judged) topics
# than this wait for the admission gate, a slot is free, admissions are not
# paused and the lead tier has quota. Scouts and the gate need a [runners]
# table: the gate must run on a different model family than the scout.
candidate_pool_low_water = 3
# Minimum hours between two scheduled scouts (whole program).
scout_min_interval_hours = 12
# true: a new researcher/experimenter workstream of an ordinary (non-program)
# project is not activated unless the ledger links it to an admitted topic.
enforce_admission = false
# Reusable scripts/SOP index offered to scouts and the gate when the file exists
# (relative to the data repository root).
asset_index_path = "registry/reusable-assets.json"
# Domains in scout rotation, in preference order; empty = every domain with an
# active program project (project.json with "program": true).
domains = []
# Calendar limit from admission to a review-ready manuscript. Past it the topic
# gets one direction decision (lead tier, other model family); it is not frozen
# outright.
max_days_from_admission_to_ready = 28
# Hard Agent-time ceiling per topic (72 h). A topic campaign's budget is the
# smaller of this and its card's cost_estimate.agent_seconds; exhausting it
# schedules one direction decision instead of needs_human, and reaching this
# ceiling freezes the topic (budget_exhausted).
topic_max_agent_seconds = 259200
# Ready papers are delivered to the paper-management site without a submission
# handler (python -m openlabs program assign-handler after the owner's review).
# false: they are only queued. Needs ARA_PAPER_MANAGE_API_URL/_KEY in the
# environment and the paper-writing CLI (paper_writing_command).
auto_handoff = false
# paper_writing_command = ["paper-writing"]
# Delivery attempts per ready paper, one per tick.
handoff_max_attempts = 3

# Per-topic direction-decision choices that keep a topic alive; afterwards only
# freeze is accepted (an exhausted choice is refused and the topic frozen).
[program.direction_limits]
targeted_core_analysis = 1
retarget_or_short_format = 2

[budget]
# Provider token-quota / rate-limit handling. Quota failures never consume
# max_attempts; they back off the affected runner tier and halve agent
# parallelism, which then recovers by restore_step per healthy completion.
# Upper bound on concurrently launched agents (also bounded by max_worker_processes).
max_parallel_agents = 3
# Exponential backoff per consecutive quota hit on one runner; a parsed provider
# reset time wins when it is later. Both are capped by quota_backoff_cap_minutes.
quota_backoff_minutes = [15, 30, 60, 120, 300]
quota_backoff_cap_minutes = 300
restore_step = 1
# Consecutive quota deferrals of one task before ordinary failure handling.
quota_retry_limit = 8
# Automatic retries of needs_human/quarantined tasks that failed for an
# infrastructure reason (transport, quota, launch, missing result bundle).
infrastructure_retry_limit = 3

[routing]
# Quota-aware runner selection. INERT until a [runners] table exists: without
# one, every runner is its own quota key and scheduling is exactly as before.
# Fraction of every provider window kept for review and decision tasks.
review_reserve = 0.15
# Readings older than this are "unknown": dispatch allowed, one task in flight.
snapshot_stale_hours = 6
unknown_headroom = 0.5
# Protected lead (Fable): of every window it depends on, keep this much for
# decision tasks only (topic admission, direction decisions, portfolio
# planning); reviews may not use it.
lead_decision_reserve = 0.25
# Fable takes reviews (and other non-decision work) only up to this used
# fraction; past it Claude-family reviews go to the Claude worker runner.
lead_review_ceiling = 0.60
# Consecutive non-infrastructure failures of a worker-tier task before its next
# attempt is routed to the lead tier with a diagnosis preamble (0 disables).
escalate_to_lead_after_failures = 2
# Provider assumed for the legacy cheap/balanced/frontier backoff keys.
legacy_runner_provider = "openai-codex"
protected_models = ["claude-fable-5-2"]
# Read once every probe_idle_minutes at most, and only while readings are stale.
probe_idle_minutes = 360
codex_sessions_dir = "~/.codex/sessions"

[routing.model_windows]
# Extra windows a model's calls report (measured 2026-11-11; name not documented).
"claude-fable-5-2" = ["seven_day_overage_included"]

[routing.probe_commands]
# Cheapest model only; a protected (Fable) model here is rejected at load time.
anthropic = ["claude", "-p", "ok", "--model", "claude-haiku-5-5", "--output-format", "stream-json", "--verbose", "--max-turns", "1"]

# [routing.task_tiers] / [routing.claim_ranks] override the built-in maps in
# orchestrator/src/openlabs/config.py (DEFAULT_TASK_TIERS, DEFAULT_CLAIM_RANKS).

